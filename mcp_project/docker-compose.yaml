services:
  mongodb:
    image: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongodb_data:/data/db

  # Vector store backing mem0 (agents/memory.py) for long-term (semantic +
  # episodic) memory. The embedder itself calls OpenAI directly - see
  # OPENAI_API_KEY in .env.example - Qdrant just stores/searches the vectors.
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mongodb_data:
  qdrant_data:

[project]
name = "mcp-orchestration"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sanketLocal", email = "sanketgdorle200105@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "cryptography>=43.0.0",
    "dotenv>=0.9.9",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "fastmcp>=2.14.1",
    "firecrawl-py>=1.0.0",
    "google-api-python-client>=2.199.0",
    "google-auth>=2.57.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "httpx>=0.27.0",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "mcp>=1.28.0,<2.0.0",
    "mem0ai>=2.0.20",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pymongo>=4.17.0",
    "python-multipart>=0.0.32",
    "sse-starlette>=3.4.8",
    "tiktoken>=0.14.0",
    "uvicorn>=0.52.1",
]

[project.scripts]
main = "mcp_orchestration.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
# Separate from `dev`: evals (see evals/run_evals.py) hit the real
# LLM/OpenAI, cost money, and aren't deterministic - a periodic/CI
# activity, not something needed for `uv sync` + `uv run pytest`.
evals = [
    "langsmith>=0.1.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
